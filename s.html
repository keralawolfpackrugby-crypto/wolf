<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matches Schedule - Kerala Wolfpack Rugby Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --primary: #FBBF24;
      --accent: #E11D48;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: linear-gradient(rgba(5, 5, 5, 0.75), rgba(5, 5, 5, 0.95)),
        url('ss.jpeg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      text-align: center;
      padding: 80px 20px 40px; /* space for fixed header */
    }

    /* Glassmorphism Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5, 5, 5, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo span {
      color: var(--primary);
      margin-left: 5px;
    }

    .logo img {
      height: 45px;
      width: 45px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 12px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .btn-home {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      text-decoration: none;
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      font-weight: 800;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: var(--primary);
      color: #000;
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
      transform: translateY(-2px);
    }

    /* Schedule Card */
    .box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(251, 191, 36, 0.2);
      padding: 3.5rem 2.5rem;
      max-width: 550px;
      width: 100%;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      margin-top: 2rem;
    }

    .box:hover {
      transform: translateY(-5px);
      box-shadow: 0 35px 70px rgba(251, 191, 36, 0.15);
    }

    .box h2 {
      font-size: clamp(2rem, 5vw, 2.5rem);
      font-weight: 900;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #fff, var(--text-muted));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .box h2 span {
      color: var(--primary);
      -webkit-text-fill-color: initial;
    }

    .box p {
      color: var(--text-muted);
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html" class="logo">
      <img src="logo.jpeg" alt="Wolfpack Logo">
      Wolfpack <span>Rugby</span>
    </a>

  </header>

  <div class="box">
    <h2>Upcoming <span>Matches</span></h2>
    <p>Updates will be available soon.</p>
  </div>
</body>

</html>
